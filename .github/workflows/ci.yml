name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  # Weekly: no lockfile is committed, so this build floats on the latest
  # @did-btcr2 releases and catches upstream API breakage early.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm build
