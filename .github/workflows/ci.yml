name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: no lockfile is committed, so this build floats on the latest
  # @did-btcr2 releases and catches upstream API breakage early.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install
      - run: pnpm typecheck
      # astro check does not typecheck .vue files.
      - run: pnpm dlx --package vue-tsc@3 --package typescript@5.9 vue-tsc --noEmit -p tsconfig.json
      # The offline examples run with no network. The other examples need a
      # funded key and a DID, so only astro check covers them.
      - run: bun src/examples/ts/create-key.ts
      - run: bun src/examples/ts/create-external.ts | grep 'valid: true'
      - run: pnpm build
